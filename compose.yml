name: acm-local

services:
  frontend:
    image: acm-frontend:local
    build:
      context: .
      dockerfile: Dockerfile.frontend
      provenance: false
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8081
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8081/ws
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      server:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  server:
    image: acm-server:local
    build:
      context: .
      dockerfile: Dockerfile.server
      provenance: false
    environment:
      PORT: 8081
      DATABASE_URL: sqlite:///var/lib/acm/db.sqlite?mode=rwc
      RAMIEL_URL: http://ramiel:8082
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the root .env}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID in the root .env}"
      DISCORD_SECRET: "${DISCORD_SECRET:?Set DISCORD_SECRET in the root .env}"
      DISCORD_REDIRECT_URI: http://127.0.0.1:3000/auth/discord
      FRONTEND_ORIGIN: http://127.0.0.1:3000
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - local_data:/var/lib/acm
    networks: [default, runner]
    depends_on:
      ramiel:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  ramiel:
    image: acm-ramiel:local
    build:
      context: .
      dockerfile: Dockerfile.ramiel
      provenance: false
    init: true
    environment:
      WASMTIME_CACHE_CONFIG: /wasmtime-cache.toml
    networks: [runner]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  local_data:

networks:
  runner:
    internal: true
