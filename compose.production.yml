services:
  caddy:
    image: acm-caddy:production
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      API_DOMAIN: "${API_DOMAIN:?API_DOMAIN must be set}"
    ports:
      - "80:80"
      - "443:443"
    networks:
      edge:
        ipv4_address: 172.30.0.2
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --resolve \"$${API_DOMAIN}:443:127.0.0.1\" \"https://$${API_DOMAIN}/healthz\" >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  server:
    image: acm-server:production
    platform: ${ACM_DOCKER_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        ACM_DOCKER_PLATFORM: ${ACM_DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    environment:
      PORT: 8081
      DATABASE_URL: sqlite:///var/lib/acm/db.sqlite?mode=rwc
      RAMIEL_URL: http://ramiel:8082
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID must be set}"
      DISCORD_REDIRECT_URI: "${DISCORD_REDIRECT_URI:?DISCORD_REDIRECT_URI must be set}"
      DISCORD_SECRET: "${DISCORD_SECRET:?DISCORD_SECRET must be set}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:?FRONTEND_ORIGIN must be set}"
      COOKIE_SECURE: "true"
      TRUSTED_PROXY_IP: 172.30.0.2
      PARALLEL_JOB_COUNT: ${PARALLEL_JOB_COUNT:-1}
    volumes:
      - ${ACM_DATA_DIR:-./.local/production-data}:/var/lib/acm
    depends_on:
      ramiel:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
      - runner
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "1.0"
    mem_limit: 512m

  ramiel:
    image: acm-ramiel:production
    build:
      context: .
      dockerfile: Dockerfile.ramiel
      args:
        ACM_DOCKER_PLATFORM: linux/amd64
    platform: linux/amd64
    restart: unless-stopped
    init: true
    environment:
      WASMTIME_CACHE_CONFIG: /wasmtime-cache.toml
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
    networks:
      - runner
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8082/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    ipam:
      config:
        # Private /24 reserved for the Caddy-to-server trust boundary.
        - subnet: 172.30.0.0/24
  runner:
    internal: true
