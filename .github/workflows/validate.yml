name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: rustfmt --edition 2021 --check crates/ramiel/compiler-sandbox.rs
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  runner-isolation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e # v1
        with:
          version: v2.39.4
      - name: Build native runner
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          docker build --platform "$TARGET_PLATFORM" --provenance=false -f Dockerfile.ramiel -t acm-runner:test .
      - name: Start restricted runner
        run: |
          docker run --detach --init --name acm-runner-test \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,exec,nosuid,size=512m \
            --cpus 2 --memory 2g --pids-limit 256 acm-runner:test
          docker exec acm-runner-test curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 --max-time 10 \
            http://127.0.0.1:8082/healthz
      - name: Test real compilers, execution limits, and file isolation
        run: python3 scripts/test-rust-runner.py docker://acm-runner-test
      - name: Check fail-closed startup without the helper
        run: |
          set +e
          output=$(docker run --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,exec,nosuid,size=512m \
            --tmpfs /usr/local/libexec:ro,size=1m acm-runner:test 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          printf '%s\n' "$output" | grep -F 'Cannot start compiler filesystem isolation'
      - name: Test complete local stack and persistence
        env:
          JWT_SECRET: ci-only-not-a-real-secret
          DISCORD_CLIENT_ID: ci-only-client
          DISCORD_SECRET: ci-only-not-a-real-secret
        run: |
          docker stop acm-runner-test
          python3 scripts/test-local-compose.py --env-file /dev/null
      - name: Show runner diagnostics on failure
        if: failure()
        env:
          JWT_SECRET: ci-only-not-a-real-secret
          DISCORD_CLIENT_ID: ci-only-client
          DISCORD_SECRET: ci-only-not-a-real-secret
        run: |
          docker logs acm-runner-test
          docker compose --env-file /dev/null logs --tail=100 server frontend ramiel

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lilith
    env:
      NEXT_PUBLIC_API_URL: https://api.example.test
      NEXT_PUBLIC_WS_URL: wss://api.example.test/ws
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: lilith/yarn.lock
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile
      - run: node --test tests/*.test.cjs
      - run: corepack yarn lint
      - run: corepack yarn build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Bash syntax
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(deploy/**/*.sh scripts/**/*.sh)
          for file in "${files[@]}"; do
            bash -n "$file"
          done
      - name: Check local startup regressions
        run: python3 scripts/tests/test_dev_local.py
      - name: Run deployment semantic tests
        shell: bash
        run: |
          [ -d "$HOME" ] && [ ! -L "$HOME" ] || exit 1
          home_mode=$(stat -c '%a' "$HOME")
          (( (8#$home_mode & 0022) == 0 )) || exit 1
          TMPDIR="$HOME/acm-deploy-test-tmp"
          umask 077
          if [ ! -e "$TMPDIR" ] && [ ! -L "$TMPDIR" ]; then
            mkdir -m 0700 "$TMPDIR"
          fi
          [ -d "$TMPDIR" ] && [ ! -L "$TMPDIR" ] || exit 1
          tmp_mode=$(stat -c '%a' "$TMPDIR")
          [ "$tmp_mode" = 700 ] || exit 1
          export TMPDIR
          for test_script in deploy/tests/*.sh; do
            "$test_script"
          done

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e # v1
        with:
          version: v2.39.4
      - name: Validate local Compose configuration
        run: python3 scripts/tests/test_local_compose.py
      - name: Validate production Compose configuration
        shell: bash
        run: |
          env_file="${RUNNER_TEMP}/acm-compose.env"
          umask 077
          printf '%s\n' \
            'ACM_DATA_DIR=/var/lib/acm' \
            'API_DOMAIN=api.example.test' \
            'JWT_SECRET=placeholder-jwt-secret' \
            'DISCORD_CLIENT_ID=placeholder-client-id' \
            'DISCORD_REDIRECT_URI=https://app.example.test/auth/discord' \
            'DISCORD_SECRET=placeholder-discord-secret' \
            'FRONTEND_ORIGIN=https://app.example.test' \
            > "$env_file"
          docker compose --env-file "$env_file" -f compose.production.yml config --quiet
